<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes"><title>PedrinhaTracker</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{width:100%;max-width:900px;margin:auto;padding:12px}h1{margin:4px 0 12px;font-size:24px}.camera{position:relative;width:100%;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;touch-action:none}#video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.painel{margin-top:12px;padding:14px;background:#171717;border-radius:16px}#status{min-height:46px;margin-bottom:10px;font-size:15px;line-height:1.4}button{width:100%;min-height:50px;margin:5px 0;border:0;border-radius:13px;font-size:16px;font-weight:800}#start{background:#fff;color:#000}#calibrar,#pedrinha{background:#303030;color:#fff}#limpar{background:#9d2222;color:#fff}.info{margin-top:10px;color:#aaa;font-size:13px;line-height:1.5}</style></head><body><main><h1>🪨 PedrinhaTracker</h1><div class="camera"><video id="video" autoplay muted playsinline webkit-playsinline></video><canvas id="canvas"></canvas></div><div class="painel"><div id="status">Toque em ABRIR CÂMERA.</div><button id="start">📷 ABRIR CÂMERA</button><button id="calibrar">1️⃣ CALIBRAR COPOS</button><button id="pedrinha">⚪ MARCAR PEDRINHA VISÍVEL</button><button id="limpar">🗑️ LIMPAR</button><div class="info">Primeiro fixe os 3 copos. Quando a pedrinha estiver visível, toque exatamente nela: uma bolinha branca será colocada sobre ela e tentará acompanhá-la apenas enquanto houver imagem suficiente para rastreá-la. As pedras da coroa não são usadas.</div></div></main><script async src="https://docs.opencv.org/4.x/opencv.js"></script><script src="app.js?v=tracker10"></script></body></html>
